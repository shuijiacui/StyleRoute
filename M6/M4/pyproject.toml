[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["resources/upstream", ".venv", "outputs"]
cache-dir = "outputs/cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# This generator embeds full Markdown paragraphs; preserve prose wrapping.
"src/tools/build_report.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Pytest's private Windows cache directories cannot be reused across the user's
# account and Codex's sandbox account. These small tests do not need persistence.
addopts = "-p no:cacheprovider"
markers = ["weights: requires the actual downloaded encoder and decoder", "ui: Streamlit interaction tests"]
